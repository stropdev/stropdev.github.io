name: pages

# strop.dev is static: every file in the repository is served as-is, so every
# push to main deploys. The generated pages are rebuilt by
# `python3 build.py /path/to/strop` and committed (see README.md); there is
# no build step here. The app repo's release workflow pings `rebuild` to
# redeploy after it pushes.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
